server {
    listen 80;
    listen [::]:80;

    server_name _;
    set $base /var/www/html;
    root $base/public;

    index index.php index.html;

    include nginxconfig.io/server/security.conf;
    include nginxconfig.io/server/general.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Telegram's exact webhook endpoint. These transport limits complement,
    # rather than replace, Telepath's application-level secret validation.
    location = /telepath/webhook {
        limit_req zone=telegram_webhook_rate burst=10 nodelay;
        limit_conn telegram_webhook_connections 5;
        client_max_body_size 256k;
        client_body_timeout 10s;
        send_timeout 15s;

        include fastcgi_params;
        fastcgi_pass fpm:9000;
        fastcgi_connect_timeout 3s;
        fastcgi_send_timeout 15s;
        fastcgi_read_timeout 15s;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    }

    # Handle PHP
    location ~ \.php$ {
        # 404
        try_files $fastcgi_script_name =404;

        # default fastcgi_params
        include fastcgi_params;

        # fastcgi settings
        fastcgi_pass			fpm:9000;
        fastcgi_index			index.php;
        fastcgi_buffers			8 16k;
        fastcgi_buffer_size		32k;

        # fastcgi params
        fastcgi_param DOCUMENT_ROOT		$realpath_root;
        fastcgi_param SCRIPT_FILENAME	$realpath_root$fastcgi_script_name;
        # fastcgi_param PHP_ADMIN_VALUE	"open_basedir=$base/:/usr/lib/php/:/tmp/";
    }

    # Additional Security: Deny access to sensitive Laravel files
    location ~ /\.(env|git|htaccess|config|yml) {
        deny all;
    }

    location ~ /(storage|tests|database|resources)/ {
        deny all;
    }
}

# Vite Proxy for Development (Only active if vite service is running)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 5173;
    server_name _;

    location / {
        proxy_pass http://vite:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
