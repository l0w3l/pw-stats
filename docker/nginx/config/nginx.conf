user nginx;
pid /run/nginx.pid;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
	multi_accept on;
	worker_connections 65535;
}

http {
    #
    # Real IP
    #

    # Доверяем только непосредственному Docker gateway/reverse proxy.
    set_real_ip_from 172.16.0.0/12;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;


    #
    # MIME и кодировка
    #

    charset utf-8;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;


    #
    # Логирование
    #

    log_format app_json escape=json
        '{'
            '"time":"$time_iso8601",'
            '"request_id":"$request_id",'
            '"client_ip":"$remote_addr",'
            '"proxy_ip":"$realip_remote_addr",'
            '"xff":"$http_x_forwarded_for",'
            '"x_real_ip":"$http_x_real_ip",'
            '"forwarded_proto":"$http_x_forwarded_proto",'
            '"host":"$host",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"protocol":"$server_protocol",'
            '"status":$status,'
            '"bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"upstream_connect_time":"$upstream_connect_time",'
            '"upstream_header_time":"$upstream_header_time",'
            '"upstream_response_time":"$upstream_response_time",'
            '"referer":"$http_referer",'
            '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log app_json
        buffer=64k
        flush=1s;

    error_log /var/log/nginx/error.log warn;


    #
    # Передача файлов и TCP
    #

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;


    #
    # Соединения и таймауты
    #

    keepalive_timeout 30s;
    keepalive_requests 1000;

    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;


    #
    # Ограничения
    #

    # Лучше переносить в конкретный server/location,
    # если 64M нужны только для загрузки файлов.
    client_max_body_size 64M;

    server_tokens off;
    types_hash_max_size 2048;


    #
    # Кэш файловых дескрипторов для статики
    #

    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;


    #
    # Сжатие
    #

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;


    #
    # Конфигурации
    #

    include /etc/nginx/nginxconfig.io/maps.conf;
    include /etc/nginx/sites-enabled/*;
}
