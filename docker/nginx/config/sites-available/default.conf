server {
    listen 80;
    listen [::]:80;

    server_name _;
    set $base /var/www/html;
    root $base/public;

    # Real IP from proxy
    include nginxconfig.io/server/real_ip.conf;

    index index.php index.html;

    include nginxconfig.io/server/security.conf;
    include nginxconfig.io/server/general.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Handle PHP
    location ~ \.php$ {
        # 404
        try_files $fastcgi_script_name =404;

        # default fastcgi_params
        include fastcgi_params;

        # fastcgi settings
        fastcgi_pass			fpm:9000;
        fastcgi_index			index.php;
        fastcgi_buffers			8 16k;
        fastcgi_buffer_size		32k;

        # fastcgi params
        fastcgi_param DOCUMENT_ROOT		$realpath_root;
        fastcgi_param SCRIPT_FILENAME	$realpath_root$fastcgi_script_name;
        # fastcgi_param PHP_ADMIN_VALUE	"open_basedir=$base/:/usr/lib/php/:/tmp/";
    }

    # Additional Security: Deny access to sensitive Laravel files
    location ~ /\.(env|git|htaccess|config|yml) {
        deny all;
    }

    location ~ /(storage|tests|database|resources)/ {
        deny all;
    }
}

# Vite Proxy for Development (Only active if vite service is running)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 5173;
    server_name _;

    location / {
        proxy_pass http://vite:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
